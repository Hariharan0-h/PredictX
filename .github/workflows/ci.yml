name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Check no data files committed
        run: |
          if git ls-files data/ | grep -E '\.(csv|parquet|bin)$'; then
            echo "ERROR: data files should not be committed"
            exit 1
          fi
          if git ls-files models/ | grep -E '\.(pkl|pt|h5)$'; then
            echo "ERROR: model files should not be committed"
            exit 1
          fi
          echo "✓ No prohibited files committed."
